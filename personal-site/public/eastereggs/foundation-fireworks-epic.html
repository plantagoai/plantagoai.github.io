<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Foundation!</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cv = document.getElementById('c');
const cx = cv.getContext('2d');
let W = cv.width = window.innerWidth;
let H = cv.height = window.innerHeight;
window.addEventListener('resize', () => { W = cv.width = window.innerWidth; H = cv.height = window.innerHeight; });

// ── Palette ───────────────────────────────────────────────────────────────────
const GOLD = ['#ffd700','#ffec80','#ffa500','#ff8c00','#fff4b0'];
const COOL = ['#4cc9f0','#c77dff','#f72585','#4361ee','#7209b7'];
const HOT  = ['#ff6b6b','#ff9f1c','#ffbe0b','#fb5607','#ff006e'];
const ALL  = [...GOLD,...COOL,...HOT,'#ffffff','#00f5d4','#6bcb77'];
const pick = arr => arr[Math.random() * arr.length | 0];

// ── Stars ─────────────────────────────────────────────────────────────────────
const STARS = Array.from({length: 220}, () => ({
  x: Math.random(), y: Math.random() * 0.75,
  r: 0.3 + Math.random() * 1.5,
  a: 0.2 + Math.random() * 0.8,
  freq: 0.4 + Math.random() * 2,
  phase: Math.random() * Math.PI * 2,
}));

function drawStars(frame) {
  cx.save();
  for (const s of STARS) {
    const tw = 0.6 + 0.4 * Math.sin(frame * 0.02 * s.freq + s.phase);
    cx.globalAlpha = s.a * tw;
    cx.fillStyle = '#fff';
    cx.beginPath();
    cx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
    cx.fill();
  }
  cx.restore();
}

// ── Particles ─────────────────────────────────────────────────────────────────
const pts = [];
class Pt {
  constructor(x, y, col, vx, vy, life, sz, grav = 0.055) {
    this.x = x; this.y = y; this.col = col;
    this.vx = vx; this.vy = vy;
    this.life = life; this.ml = life;
    this.sz = sz; this.grav = grav;
  }
  tick() { this.x += this.vx; this.y += this.vy; this.vy += this.grav; this.vx *= 0.985; this.life--; }
  draw() {
    const a = Math.pow(this.life / this.ml, 0.55);
    cx.globalAlpha = a; cx.fillStyle = this.col;
    cx.beginPath(); cx.arc(this.x, this.y, this.sz * Math.max(0.1, a), 0, Math.PI * 2); cx.fill();
  }
}

// ── Burst shapes ──────────────────────────────────────────────────────────────
function chrysanthemum(x, y, col1, col2, big) {
  const n = big ? 200 : 120, spd = big ? 7 : 4.5;
  for (let i = 0; i < n; i++) {
    const a = (Math.PI * 2 / n) * i;
    const wave = 1 + 0.4 * Math.sin(a * 7);
    const s = spd * wave * (1 + Math.random() * 0.3);
    pts.push(new Pt(x, y, i % 3 ? col1 : col2, Math.cos(a) * s, Math.sin(a) * s, 90 + Math.random() * 70, big ? 3.5 : 2));
  }
}
function peony(x, y, col) {
  const n = 160;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 1 + Math.random() * 6;
    pts.push(new Pt(x, y, col, Math.cos(a) * s, Math.sin(a) * s - 1, 100 + Math.random() * 60, 2.2, 0.04));
  }
}
function willow(x, y, col) {
  const n = 120;
  for (let i = 0; i < n; i++) {
    const a = (Math.PI * 2 / n) * i, s = 2 + Math.random() * 4;
    pts.push(new Pt(x, y, col, Math.cos(a) * s, Math.sin(a) * s, 120 + Math.random() * 60, 1.8, 0.09));
  }
}
function ring_burst(x, y, col) {
  const n = 80;
  for (let i = 0; i < n; i++) {
    const a = (Math.PI * 2 / n) * i;
    pts.push(new Pt(x, y, col,      Math.cos(a) * 5, Math.sin(a) * 5, 50 + Math.random() * 20, 1.5, 0));
    pts.push(new Pt(x, y, '#ffffff',Math.cos(a) * 3, Math.sin(a) * 3, 30 + Math.random() * 20, 1,   0));
  }
}
function sparkle_shower(x, y) {
  for (let i = 0; i < 60; i++) {
    const a = Math.random() * Math.PI * 2, s = 0.5 + Math.random() * 3;
    pts.push(new Pt(x, y, '#ffffff', Math.cos(a) * s, Math.sin(a) * s - 1, 30 + Math.random() * 30, 1, 0.12));
  }
}
function goldFall(x, y) {
  for (let i = 0; i < 80; i++) {
    const vx = (Math.random() - 0.5) * 4, vy = -Math.random() * 3;
    pts.push(new Pt(x, y, pick(GOLD), vx, vy, 120 + Math.random() * 80, 1.5, 0.07));
  }
}

function bigBurst(x, y) {
  const t = Math.random(), c1 = pick(ALL), c2 = pick(ALL);
  if      (t < 0.30) chrysanthemum(x, y, c1, c2, true);
  else if (t < 0.55) peony(x, y, c1);
  else if (t < 0.75) willow(x, y, c1);
  else               ring_burst(x, y, c1);
  sparkle_shower(x, y);
  goldFall(x, y);
  setTimeout(() => {
    chrysanthemum(x + (Math.random() - 0.5) * 80, y + (Math.random() - 0.5) * 40, pick(ALL), pick(ALL), false);
    sparkle_shower(x, y);
  }, 150 + Math.random() * 120);
}
function smallBurst(x, y) {
  chrysanthemum(x, y, pick(ALL), pick(ALL), false);
  sparkle_shower(x, y);
}

// ── Confetti ──────────────────────────────────────────────────────────────────
const confetti = [];
class Conf {
  constructor(init) { this.reset(init); }
  reset(init) {
    this.x  = Math.random() * W;
    this.y  = init ? Math.random() * H : -10;
    this.vx = (Math.random() - 0.5) * 3;
    this.vy = 1 + Math.random() * 3;
    this.rot  = Math.random() * Math.PI * 2;
    this.drot = (Math.random() - 0.5) * 0.2;
    this.w = 6 + Math.random() * 8;
    this.h = 3 + Math.random() * 4;
    this.col = pick([...GOLD, ...COOL, ...HOT]);
  }
  tick() {
    this.x += this.vx; this.y += this.vy; this.rot += this.drot;
    this.vx += Math.sin(Date.now() * 0.001 + this.y * 0.05) * 0.05;
    if (this.y > H + 20) this.reset(false);
  }
  draw(alpha) {
    cx.save();
    cx.translate(this.x, this.y); cx.rotate(this.rot);
    cx.globalAlpha = alpha * 0.9; cx.fillStyle = this.col;
    cx.fillRect(-this.w / 2, -this.h / 2, this.w, this.h);
    cx.restore();
  }
}
for (let i = 0; i < 120; i++) confetti.push(new Conf(true));

// ── Rockets ───────────────────────────────────────────────────────────────────
const rockets = [];
class Rocket {
  constructor(targetX, targetY, big = false, delayFrames = 0) {
    this.delay = delayFrames;
    this.x = targetX != null ? targetX : 80 + Math.random() * (W - 160);
    this.y = H + 10;
    const tY = targetY != null ? targetY : 60 + Math.random() * (H * 0.5);
    const dist = this.y - tY;
    this.vy  = -Math.sqrt(2 * 0.22 * dist);
    this.vx  = (Math.random() - 0.5) * 2.5;
    this.col = pick(ALL);
    this.big = big;
    this.trail = [];
    this.dead  = false;
  }
  tick() {
    if (this.delay > 0) { this.delay--; return; }
    this.trail.push({x: this.x, y: this.y});
    if (this.trail.length > 10) this.trail.shift();
    this.x += this.vx; this.y += this.vy; this.vy += 0.22;
    if (Math.random() < 0.6)
      pts.push(new Pt(this.x, this.y, '#fffde7', (Math.random()-0.5)*0.5, Math.random()*0.5, 8+Math.random()*6, 0.8, 0.01));
    if (this.vy >= 0) {
      this.big ? bigBurst(this.x, this.y) : smallBurst(this.x, this.y);
      this.dead = true;
    }
  }
  draw() {
    if (this.delay > 0 || this.dead) return;
    this.trail.forEach((p, i) => {
      cx.globalAlpha = (i / this.trail.length) * 0.8;
      cx.fillStyle = this.col;
      cx.beginPath(); cx.arc(p.x, p.y, 2, 0, Math.PI * 2); cx.fill();
    });
    cx.globalAlpha = 1; cx.fillStyle = '#fff';
    cx.beginPath(); cx.arc(this.x, this.y, 3, 0, Math.PI * 2); cx.fill();
  }
}

// ── Cycle state ───────────────────────────────────────────────────────────────
// Phase 1  0–7 s   : steady build-up (12-16 rockets, smallBurst / smallBurst)
// Phase 2  7–9 s   : crescendo barrage (20 rockets, big bursts, peak interval starts)
// Phase 3  9–13.6s : TEXT REVEAL + confetti + continuous rockets (peak interval)
// Phase 4 13.6–16s : wind-down, no new launches
const CYCLE_MS = 16000;
let cycleStart = performance.now();
let textAlpha = 0, confettiAlpha = 0;
let launches = [], crescendoDone = false;
let peakIval = null, centreIval = null;
let frame = 0;

function buildLaunches() {
  launches = [];
  const n = 12 + Math.floor(Math.random() * 5);
  for (let i = 0; i < n; i++)
    launches.push({ t: 200 + Math.random() * 6600, fired: false, big: Math.random() < 0.3 });
  launches.sort((a, b) => a.t - b.t);
}

function fireCrescendo() {
  // Opening barrage: 20 rockets staggered by 4 frames
  for (let i = 0; i < 20; i++)
    rockets.push(new Rocket(null, null, Math.random() < 0.5, i * 4));
  // Two big centrepieces
  rockets.push(new Rocket(W/2 + (Math.random()-0.5)*200, 60 + Math.random()*100, true, 0));
  rockets.push(new Rocket(W/2 + (Math.random()-0.5)*200, 60 + Math.random()*100, true, 25));
}

function startPeakIntervals() {
  if (peakIval) return;
  peakIval = setInterval(() => {
    const n = 2 + Math.floor(Math.random() * 3);
    for (let i = 0; i < n; i++)
      rockets.push(new Rocket(null, null, Math.random() < 0.4, i * 8 + Math.random() * 10));
  }, 320);
  centreIval = setInterval(() => {
    rockets.push(new Rocket(W/2 + (Math.random()-0.5)*200, 60 + Math.random()*100, true, 0));
  }, 1400);
}

function stopPeakIntervals() {
  clearInterval(peakIval);  peakIval  = null;
  clearInterval(centreIval); centreIval = null;
}

buildLaunches();

// ── Render loop ───────────────────────────────────────────────────────────────
function loop(ts) {
  requestAnimationFrame(loop);
  frame++;

  const elapsed = ts - cycleStart;

  // Fade trail
  cx.globalAlpha = 0.13; cx.fillStyle = '#000005'; cx.fillRect(0, 0, W, H);
  cx.globalAlpha = 1;

  drawStars(frame);

  // ── Phase transitions ──
  if (elapsed < 7000) {
    // Build-up: fire scheduled rockets
    for (const s of launches)
      if (!s.fired && elapsed >= s.t) { rockets.push(new Rocket(null, null, s.big)); s.fired = true; }

  } else if (!crescendoDone) {
    // Crescendo fires once
    fireCrescendo();
    startPeakIntervals();
    crescendoDone = true;
  }

  // Text + confetti alpha
  if (elapsed >= 9000 && elapsed < 10600) {
    textAlpha = confettiAlpha = (elapsed - 9000) / 1600;
  } else if (elapsed >= 10600 && elapsed < 12200) {
    textAlpha = confettiAlpha = 1;
  } else if (elapsed >= 12200 && elapsed < 13800) {
    textAlpha = confettiAlpha = 1 - (elapsed - 12200) / 1600;
  } else if (elapsed < 9000 || elapsed >= 13800) {
    textAlpha = confettiAlpha = 0;
  }

  // Cycle reset
  if (elapsed >= CYCLE_MS) {
    stopPeakIntervals();
    cycleStart = ts;
    rockets.length = 0; pts.length = 0;
    textAlpha = confettiAlpha = 0;
    crescendoDone = false;
    confetti.forEach(c => c.reset(false));
    buildLaunches();
    return;
  }

  // Confetti (text phase only)
  if (confettiAlpha > 0)
    confetti.forEach(c => { c.tick(); c.draw(confettiAlpha); });

  // Rockets
  for (let i = rockets.length - 1; i >= 0; i--) {
    rockets[i].tick();
    if (rockets[i].dead) { rockets.splice(i, 1); continue; }
    rockets[i].draw();
  }

  // Particles
  for (let i = pts.length - 1; i >= 0; i--) {
    pts[i].tick();
    if (pts[i].life <= 0) { pts.splice(i, 1); continue; }
    pts[i].draw();
  }

  cx.globalAlpha = 1;
  drawText();
}

function drawText() {
  if (textAlpha <= 0) return;
  cx.save();
  cx.globalAlpha = textAlpha;
  cx.textAlign = 'center'; cx.textBaseline = 'middle';

  const size = Math.min(W * 0.088, 84);
  const ox = W / 2, oy = H / 2;

  // Bloom pass
  cx.font = `bold ${size}px Georgia, 'Times New Roman', serif`;
  cx.shadowColor = '#ffd700'; cx.shadowBlur = 48;
  cx.fillStyle = 'rgba(255,215,0,0.35)';
  cx.fillText('Happy Foundation!', ox, oy);
  cx.fillText('Happy Foundation!', ox, oy);

  // Gold gradient fill
  cx.shadowBlur = 18; cx.shadowColor = '#fff8aa';
  const g = cx.createLinearGradient(ox - size*3.8, oy - size, ox + size*3.8, oy + size);
  g.addColorStop(0.0, '#ff9900'); g.addColorStop(0.3, '#ffd700');
  g.addColorStop(0.5, '#fffacd'); g.addColorStop(0.7, '#ffd700'); g.addColorStop(1.0, '#ff9900');
  cx.fillStyle = g;
  cx.fillText('Happy Foundation!', ox, oy);

  // Subtitle
  cx.shadowBlur = 14; cx.shadowColor = '#aabbff';
  const sub = Math.min(W * 0.028, 22);
  cx.font = `${sub}px Georgia, 'Times New Roman', serif`;
  cx.fillStyle = 'rgba(195,210,255,0.92)';
  cx.fillText('❖ Here’s to what comes next ❖', ox, oy + size * 1.12);

  cx.restore();
}

requestAnimationFrame(loop);
</script>
</body>
</html>

name: deploy-site-once
# One-off (Dagan asked 2026-10-30): builds site/ from main's content and deploys plantagoai.com hosting only,
# so the new Dreamless poster goes live. Same steps as scripts/deploy.sh site. Branch is deleted afterwards.
on:
  push:
    branches: ["claude/deploy-plantagoai-site"]
    paths: [".github/workflows/deploy-site-once.yml"]
permissions: { contents: read }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Build site
        working-directory: site
        run: (npm ci || npm install) && rm -rf dist && npm run build && test -f dist/index.html && ls -la dist/dreamless-poster-v2.webp
      - run: npm install -g firebase-tools
      - name: Credentials
        env: { SA_JSON: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_PLANTAGOAI }}" }
        run: printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
      - name: Deploy hosting (plantagoai.com)
        working-directory: site
        env: { GOOGLE_APPLICATION_CREDENTIALS: "${{ runner.temp }}/sa.json" }
        run: firebase deploy --project plantagoai --only hosting

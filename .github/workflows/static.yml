# Deploys two things on every push to main:
#   1. Root static content → GitHub Pages (the plantagoai marketing/stealth page)
#   2. personal-site/ (React/Vite) → Firebase Hosting dagangilat-site (dagangilat.com)
#
# Required secrets (repo Settings → Secrets → Actions):
#   FIREBASE_SERVICE_ACCOUNT_SOLANAVOTE_DEVNET  — SA key for the solanavote-devnet project

name: Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "deploy"
  cancel-in-progress: false

jobs:
  deploy-pages:
    name: Deploy static content → GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-personal-site:
    name: Build + deploy personal site → Firebase (dagangilat.com)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install + build personal-site
        working-directory: personal-site
        run: npm install && npm run build

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Write service-account JSON
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOLANAVOTE_DEVNET }}
        run: |
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          chmod 600 "$RUNNER_TEMP/sa.json"

      - name: Deploy hosting → prod
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: firebase deploy --project prod --only hosting:personal
